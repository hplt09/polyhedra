<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>polyhedra · studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0c1a;
        --ink: #f5f5fa;
        --muted: rgba(245, 245, 250, 0.45);
        --accent: #ff3b6b;
        --panel: rgba(245, 245, 250, 0.05);
        --panel-border: rgba(245, 245, 250, 0.12);
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo,
          Consolas, monospace;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--mono);
        color: var(--ink);
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #gl, #hud {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
      }
      #gl {
        z-index: 0;
        cursor: crosshair;
      }
      #hud {
        z-index: 1;
        pointer-events: none;
      }
      .panel {
        position: fixed;
        bottom: 14px;
        right: 16px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        border-radius: 2px;
        padding: 10px 12px;
        font: 10px/1.4 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        z-index: 2;
        display: grid;
        gap: 8px;
        min-width: 220px;
      }
      .audio-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .audio-row button {
        font: 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--panel-border);
        padding: 6px 10px;
        border-radius: 2px;
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }
      .audio-row button:hover {
        border-color: var(--accent);
        background: rgba(255, 59, 107, 0.08);
      }
      .audio-row button[hidden] {
        display: none;
      }
      .audio-status {
        font: 10px/1.2 var(--mono);
        letter-spacing: 0.06em;
        color: var(--muted);
        min-height: 12px;
        text-transform: none;
      }
      .audio-hint {
        font: 10px/1.5 var(--mono);
        letter-spacing: 0.04em;
        color: var(--muted);
        text-transform: none;
        display: grid;
        gap: 2px;
      }
      .audio-hint b {
        color: var(--ink);
        font-weight: 400;
      }

      /* Splash overlay — shown once per load to introduce the controls.
         Tapping anywhere dismisses it; the same tap also satisfies the
         AudioContext autoplay gesture requirement. */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        background: rgba(12, 12, 26, 0.86);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: var(--ink);
        padding: 24px;
        transition: opacity 220ms ease;
        cursor: pointer;
      }
      .splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        display: grid;
        gap: 22px;
        justify-items: center;
        max-width: 420px;
        text-align: center;
      }
      .splash-title {
        font-family: "Bebas Neue", "Anton", "Archivo Black", sans-serif;
        font-size: 56px;
        letter-spacing: 0.16em;
        line-height: 1;
        color: var(--ink);
      }
      .splash-sub {
        font: 11px/1 var(--mono);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .splash-body {
        font: 12px/1.7 var(--mono);
        letter-spacing: 0.04em;
        color: var(--muted);
        display: grid;
        gap: 8px;
      }
      .splash-body b {
        color: var(--ink);
        font-weight: 400;
      }
      .splash-cta {
        font: 11px/1 var(--mono);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid var(--accent);
        background: transparent;
        padding: 14px 26px;
        border-radius: 2px;
        cursor: pointer;
      }

      /* Mobile tweaks — larger tap targets, hide PC-only controls/hints,
         compact panel. */
      @media (max-width: 767px) {
        #gl { cursor: default; }
        .panel {
          left: 12px;
          right: 12px;
          bottom: max(12px, env(safe-area-inset-bottom));
          min-width: 0;
          padding: 12px 14px;
        }
        .audio-row button {
          padding: 10px 14px;
          font-size: 11px;
          min-height: 40px;
        }
        #tabBtn { display: none; }
        .audio-hint .desktop-only { display: none; }
        .splash-title { font-size: 44px; }
        .splash-body { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div class="splash-sub">audio-reactive polyhedra</div>
        <div class="splash-title">POLYHEDRA</div>
        <div class="splash-body">
          <div><b>MIC</b> — マイクで周囲の音を拾います（スマホ向け）</div>
          <div><b>TAB AUDIO</b> — 別タブで再生中の BGM に同期します（PC向け）</div>
          <div>無音時は画面タップで形と配色が切り替わります</div>
        </div>
        <button class="splash-cta">tap to enter</button>
      </div>
    </div>
    <div class="panel">
      <div class="audio-row">
        <button id="micBtn">mic</button>
        <button id="tabBtn">tab audio</button>
        <button id="stopBtn" hidden>stop</button>
      </div>
      <div class="audio-hint">
        <div><b>mic</b> — スマホはこちらでスピーカーから集音</div>
        <div class="desktop-only"><b>tab audio</b> — PCで別タブの BGM を取り込む</div>
      </div>
      <div class="audio-status" id="audioStatus"></div>
    </div>
    <script type="module" src="/src/polyhedra.ts"></script>
  </body>
</html>
